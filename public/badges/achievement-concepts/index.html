<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>All achievements · Badge gallery</title>
  <link rel="stylesheet" href="navigation.css">
  <link rel="stylesheet" href="gallery.css">
  <script defer src="sections.js"></script>
  <script defer src="navigation.js?v=no-arrows-v1"></script>
  <script defer src="gallery.js?v=no-arrows-v1"></script>
</head>
<body>
  <main>
    <div data-achievement-navigation></div>
    <p class="eyebrow">Achievement emblems</p>
    <h1>All achievements</h1>
    <p class="intro">Browse the collection, compare sections, or open an achievement for a closer look.</p>
    <div class="filters">
      <label class="search-label">Find an achievement<input id="search" type="search" placeholder="Search names, descriptions, or sections…" autocomplete="off"></label>
      <label>Section<select id="section"><option value="all">All sections</option></select></label>
      <button id="clear" type="button">Clear filters</button>
    </div>
    <div class="controls" aria-label="Preview controls">
      <label>View<select id="view"><option value="badge">Inside the frame</option><option value="symbol">Emblem only</option></select></label>
      <label>Center<select id="center"><option value="black">Black</option><option value="navy">Navy</option><option value="purple">Purple</option><option value="teal">Teal</option></select></label>
      <label>Frame<select id="frame"><option value="auto">Match emblem</option><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option></select></label>
      <label>Backdrop<select id="background"><option value="dark">Dark</option><option value="light">Light</option></select></label>
    </div>
    <p id="summary" role="status" aria-live="polite">Loading achievements…</p>
    <p id="load-error" role="alert" hidden></p>
    <p id="empty" hidden>No achievements match. Try another search or clear the filters.</p>
    <div id="sections"></div>
    <noscript>Enable JavaScript to browse the gallery. <a href="final-table-v1/index.html">Open The Final Table</a>.</noscript>
  </main>
</body>
</html>
